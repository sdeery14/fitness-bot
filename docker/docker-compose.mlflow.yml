version: '3.8'

services:
  # PostgreSQL database for MLflow tracking
  mlflow-postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port to avoid conflict with main app postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlflow-network

  # MinIO for artifact storage
  mlflow-minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_password
    command: server /data --console-address ":9001"
    volumes:
      - mlflow-minio-data:/data
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlflow-network

  # MLflow tracking server
  mlflow-server:
    build:
      context: ../mlflow
      dockerfile: Dockerfile
    container_name: mlflow-server
    environment:
      # Database backend for tracking
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflow_password@mlflow-postgres:5432/mlflow
      
      # MinIO artifact store
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: minio_admin
      AWS_SECRET_ACCESS_KEY: minio_admin_password
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-minio:9000
      
      # Server config
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: 5000
    command: >
      sh -c "
        python /app/create_bucket.py &&
        mlflow server
          --backend-store-uri postgresql://mlflow:mlflow_password@mlflow-postgres:5432/mlflow
          --artifacts-destination s3://mlflow-artifacts
          --host 0.0.0.0
          --port 5000
          --gunicorn-opts '--timeout 120 --workers 2'
      "
    ports:
      - "5000:5000"
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-minio:
        condition: service_healthy
    volumes:
      - mlflow-server-data:/mlflow
    networks:
      - mlflow-network

volumes:
  mlflow-postgres-data:
  mlflow-minio-data:
  mlflow-server-data:

networks:
  mlflow-network:
    driver: bridge
